[defaults]
# Define o caminho padrão do inventário para o aluno não ter que digitá-lo no comando
inventory = inventory.ini

# Desativa a criação de arquivos .retry caso o playbook falhe (evita sujeira no projeto)
retry_files_enabled = False

# Desativa alertas visuais sobre comportamento de comandos ou do próprio Python
command_warnings = False
deprecation_warnings = False

# Deixa a saída do terminal mais legível e colorida para os alunos
stdout_callback = yaml

# Ignora a checagem de chaves SSH, já que a conexão com o cluster é local via API
host_key_checking = False
